<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070817">
  <meta name="description" content="ORBIT — Uma experiência visual e interativa para explorar o Sistema Solar, comparar planetas e descobrir as histórias da exploração espacial.">
  <meta name="author" content="Luana Figueiredo">
  <meta property="og:title" content="ORBIT — Explore o Sistema Solar">
  <meta property="og:description" content="O universo está mais perto do que parece. Explore planetas, órbitas, curiosidades e missões espaciais.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="noctis/orbit-link.css">
  <title>ORBIT — Explore o Sistema Solar</title>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="app"></div>
  <noscript>Ative o JavaScript no navegador para explorar o ORBIT.</noscript>
  <script src="js/data.js" defer></script>
  <script src="js/orbits.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="alunar/orbit-link.js" defer></script>
  <script src="noctis/orbit-link.js" defer></script>
  <script src="aeon/orbit-link.js" defer></script>

  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        const notice = document.createElement('aside');
        notice.id = 'orbit-local-notice';
        notice.setAttribute('role', 'alert');
        notice.tabIndex = -1;
        notice.innerHTML = '<strong>Abra o ORBIT pelo servidor local</strong><span>Para acessar ÆON, ALUNAR e NOCTIS, execute <b>ABRIR_ORBIT.bat</b> na pasta do projeto. A página será aberta automaticamente.</span>';
        notice.style.cssText = 'position:fixed;z-index:9999;top:90px;left:50%;transform:translateX(-50%);width:min(92vw,620px);padding:17px 22px;border:1px solid #bba5f2;border-radius:15px;background:#181632;color:#fff;box-shadow:0 18px 70px #0009;font:14px/1.6 Arial,sans-serif;display:grid;gap:5px;text-align:center;';
        document.body.append(notice);
        document.addEventListener('click', event => {
          const link = event.target.closest('a[href]');
          if (!link) return;
          const path = link.getAttribute('href');
          if (/^(?:\.\/)?(?:aeon|alunar|noctis)\//i.test(path)) {
            event.preventDefault();
            notice.focus();
          }
        }, true);
      });
    }
  </script>
</body>
</html>
